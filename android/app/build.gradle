apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Folders */
    root = file("../")
    reactNativeDir = file("../node_modules/react-native")
    codegenDir = file("../node_modules/@react-native/codegen")
}

def enableSeparateBuildPerCPUArchitecture = false
def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.imyap"
    defaultConfig {
        applicationId "com.imyap"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Release signing configuration
            // To build a release APK, you need to create a keystore and configure these properties:
            // Option 1: In ~/.gradle/gradle.properties or android/gradle.properties (not committed):
            //   IMYAP_RELEASE_STORE_FILE=/path/to/your/keystore.jks
            //   IMYAP_RELEASE_KEY_ALIAS=your-key-alias
            //   IMYAP_RELEASE_STORE_PASSWORD=your-store-password
            //   IMYAP_RELEASE_KEY_PASSWORD=your-key-password
            // Option 2: Set environment variables with the same names
            //
            // For now, release builds will fail if these are not set (secure by default)
            if (project.hasProperty('IMYAP_RELEASE_STORE_FILE')) {
                storeFile file(IMYAP_RELEASE_STORE_FILE)
                storePassword IMYAP_RELEASE_STORE_PASSWORD
                keyAlias IMYAP_RELEASE_KEY_ALIAS
                keyPassword IMYAP_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Only sign release builds if release signing is configured
            // This prevents accidentally creating insecure release builds with debug keys
            if (project.hasProperty('IMYAP_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            shrinkResources enableProguardInReleaseBuilds
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
